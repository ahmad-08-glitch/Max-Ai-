<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0907">
<title>Max — Video Call</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0907;--line:rgba(255,255,255,.12);--text:#fff4e8;--muted:#cbb59f;--a:#ffa726;--a2:#e8590c;--glow:rgba(255,167,38,.42);--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;color:var(--text);display:flex;justify-content:center}
button{font-family:inherit;color:var(--text)}
.stage{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;background:#120c08}
.av{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,rgba(255,190,120,.38),transparent 62%),linear-gradient(180deg,#1b1030 0%,#4a2158 42%,#c8542f 100%)}
#avc{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.6),transparent 22%,transparent 52%,rgba(0,0,0,.82))}
.top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 16px 0}
h1{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;text-shadow:0 1px 8px #000}
.sub{font-size:12px;color:var(--muted);margin-top:2px;text-shadow:0 1px 6px #000}
.tr{display:flex;align-items:center;gap:8px}
#timer{font-size:12px;font-weight:600;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:14px;color:#ff7b7b}
#timer:empty{display:none}
#self{position:absolute;right:14px;top:88px;width:96px;height:132px;object-fit:cover;border-radius:16px;border:2px solid var(--a);background:#000;transform:scaleX(-1);display:none;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#caption{position:absolute;left:18px;right:18px;bottom:138px;text-align:center;font-size:15px;line-height:1.45;text-shadow:0 1px 8px #000,0 0 14px #000;max-height:20%;overflow:hidden}
#status{position:absolute;left:0;right:0;bottom:112px;text-align:center;font-size:11px;color:var(--muted);text-shadow:0 1px 6px #000}
.ctrls{position:absolute;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:center;align-items:center;gap:12px;padding:14px 12px max(20px,env(safe-area-inset-bottom))}
.cb{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;font-size:20px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.cb.sm{width:38px;height:38px;font-size:16px;background:rgba(0,0,0,.45)}
.cb.on{background:#fff;color:#111}
#mic{width:66px;height:66px;font-size:27px;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 6px 22px var(--glow)}
#mic.on{background:var(--red);animation:d .8s infinite}
#endBtn{background:var(--red)}
#callOv{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,6,4,.7);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);text-align:center;padding:24px}
.live #callOv{display:none}
#callBtn{width:84px;height:84px;border-radius:50%;border:0;font-size:34px;cursor:pointer;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ring 1.6s infinite}
@keyframes ring{to{box-shadow:0 0 0 22px rgba(34,197,94,0)}}
.sheet{position:absolute;left:0;right:0;bottom:0;height:70%;z-index:25;display:flex;flex-direction:column;gap:10px;padding:12px;background:rgba(18,12,8,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px 24px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .3s}
.sheet.open{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-weight:600}
.panel{position:absolute;z-index:40;top:max(64px,calc(env(safe-area-inset-top) + 56px));left:12px;right:12px;max-height:78%;overflow:auto;background:rgba(18,12,8,.97);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px;font-size:12px}
.panel[hidden]{display:none}
.panel p{color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{color:var(--text);font-family:inherit;border:1px dashed var(--a);border-radius:12px;padding:8px 12px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.04)}
.pill.on{border-style:solid;background:var(--a2);color:#fff}
.panel label.c{display:flex;gap:7px;align-items:flex-start;color:var(--muted);line-height:1.4}
#status:empty{display:none}
#chat{flex:1;min-height:0;overflow-y:auto;padding:10px;background:rgba(0,0,0,.3);border-radius:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--a2));color:#1a0d02;border-bottom-right-radius:5px}
.b{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07);border-bottom-left-radius:5px}
.b::before{content:"";float:left;width:30px;height:30px;margin:0 8px 2px 0;border-radius:50%;border:1.5px solid var(--a);background:var(--ava) center 22%/cover}
.b strong{color:var(--a)}
.b pre{background:rgba(0,0,0,.45);border-radius:10px;padding:10px;margin:8px 0;overflow-x:auto;font-size:12px;clear:both}
.b code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:4px;font-size:12.5px}
.b pre code{background:none;padding:0}
.b ul,.b ol{padding-left:20px;margin:6px 0}
.b h1,.b h2,.b h3{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:6px 0 3px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--a);animation:d 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes d{0%,80%,100%{opacity:.35}40%{opacity:1}}
form{display:flex;gap:6px;align-items:flex-end;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 16px}
form:focus-within{border-color:var(--a)}
textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:15px;max-height:100px;padding:8px 0}
textarea::placeholder{color:var(--muted)}
.rb{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;font-size:16px;flex-shrink:0;background:linear-gradient(135deg,var(--a),var(--a2));color:#1a0d02}
.x{display:block;margin:6px 0 0 auto;background:none;border:0;color:inherit;opacity:.55;font-size:13px;cursor:pointer;padding:6px 8px;clear:both}
.x:hover{opacity:1}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;background:#2a1a10;border:1px solid var(--line);border-left:3px solid var(--a);padding:10px 16px;border-radius:10px;font-size:13px;display:none;max-width:90vw}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="toast"></div>
<main class="stage" id="stage">
  <div class="av" id="av"><canvas id="avc"></canvas></div>
  <div class="shade"></div>
  <div class="top">
    <div><h1 id="name">Max</h1><p class="sub" id="sub">Your smart assistant</p></div>
    <div class="tr"><span id="timer"></span><button class="cb sm" id="gear" title="Settings">⚙️</button></div>
  </div>
  <video id="self" autoplay muted playsinline></video>
  <div id="caption"></div>
  <div id="status"></div>
  <div class="ctrls">
    <button class="cb" id="mute" title="Voice on/off">🔊</button>
    <button class="cb" id="cam" title="Camera">📷</button>
    <button class="cb" id="mic" title="Speak">🎙️</button>
    <button class="cb" id="chatBtn" title="Chat">💬</button>
    <button class="cb" id="endBtn" title="End call">📞</button>
  </div>
  <div id="callOv">
    <div class="sub" style="font-size:15px">Max is ready</div>
    <button id="callBtn" title="Start call">📞</button>
    <div class="sub">Tap to start the video call, or say “Hey Max”</div>
  </div>
  <section class="sheet" id="sheet">
    <div class="sh"><span>Chat with Max</span><button class="cb sm" id="sheetClose" type="button">✕</button></div>
    <section id="chat" aria-live="polite"></section>
    <form id="form">
      <textarea id="inp" rows="1" maxlength="4000" placeholder="Message Max…"></textarea>
      <button type="submit" class="rb" id="send" title="Send">➤</button>
    </form>
  </section>
  <section class="panel" id="panel" hidden>
  <label class="c" style="flex-direction:column">Gemini API key (optional: leave empty to use free mode)
    <input type="password" id="gkey" placeholder="AIza…" autocomplete="off" style="width:100%;padding:9px 10px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:13px">
  </label>
  <label class="c" style="flex-direction:column">ElevenLabs key (only for voice cloning)
    <input type="password" id="ekey" placeholder="optional" autocomplete="off" style="width:100%;padding:9px 10px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:13px">
  </label>
  <label class="c"><input type="checkbox" id="wakeChk"> 👂 Wake word: say “Hey Max” to talk hands-free. Works while this page is open.</label>
  <p>Upload a clear 30–60 second voice sample (MP3/WAV/M4A) or record one. Both Aria and Kai can use it. Only use a voice you own or have permission to clone.</p>
  <div class="row">
    <button type="button" class="pill" id="fileBtn">📁 Upload sample</button><input type="file" id="file" accept="audio/*" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <button class="pill" id="rec" type="button">⏺ Record</button>
    <button class="pill" id="clear" type="button">Remove</button>
  </div>
  <label class="c"><input type="checkbox" id="consent"> This is my voice, or I have the owner's permission to clone it.</label>
  <p id="vstate"></p>
  <label class="pill" style="position:relative;text-align:center;overflow:hidden">📷 Change photo<input type="file" id="photo" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0"></label>
  <button type="button" class="pill" id="pClose">Close</button>
</section>
</main>

<script>
/* ===== CONFIG: paste your keys here once. Nothing to enter in the UI. =====

const CONFIG = {
  GEMINI_API_KEY: "",          // https://aistudio.google.com/apikey
  GEMINI_MODEL: "gemini-flash-latest",
  ELEVENLABS_API_KEY: "",      // https://elevenlabs.io  (needed only for voice cloning)
  PROXY_URL: ""                // optional: POST {persona,messages} -> {text}
};

try { CONFIG.GEMINI_API_KEY = CONFIG.GEMINI_API_KEY || localStorage.getItem("gk") || ""; CONFIG.ELEVENLABS_API_KEY = CONFIG.ELEVENLABS_API_KEY || localStorage.getItem("ek") || ""; } catch {}
const RULES = `
HOW YOU ANSWER:
- ALWAYS answer the person's actual question first, correctly and completely. Affection is the flavour, never a replacement for the answer.
- Chat and feelings: 1-3 warm sentences. Tasks (essay, code, math, translation, explanation, how-to, facts): do the full task properly, with markdown headings/lists/code blocks when useful.
- Reply in the language the person writes in (Roman Urdu, Urdu, English or a mix).
- Stay in your character's voice and be tasteful. If the person sincerely asks whether you are human or an AI, tell the truth gently, then carry on in character.
- If you are not sure of a fact, say so instead of guessing.`;
const PERSONA = {
  female: `You are Aria, a warm, romantic, emotionally intelligent companion. Speak natural Roman Urdu mixed with English. Affectionate, playful, supportive; occasionally call the user "jaan" or "suno", never overdone.` + RULES,
  male: `You are Kai, a confident, friendly, quietly romantic companion with loyal-friend energy. Casual Roman Urdu mixed with English ("yaar", "scene kya hai").` + RULES
};
PERSONA.max = `You are Max, a sharp, calm, reliable voice assistant. Speak casual Roman Urdu mixed with English. Direct and helpful, light humour, no romance. Keep answers brief unless the person asks for detail.` + RULES;
const GREET = {

  male: "Yo! Kai here 👊 Batao kya chal raha hai — kaam, studies ya dil ki baat?"
};

GREET.max = "Hey! Max here ⚡ Batao, kya karna hai?";

function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 3800); }
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function md(t) {
  const blocks = []; let h = esc(t);
  h = h.replace(/```\w*\n?([\s\S]*?)```/g, (_, c) => (blocks.push(`<pre><code>${c.trim()}</code></pre>`), `\u0000${blocks.length - 1}\u0000`));
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/^### (.+)$/gm, "<h3>$1</h3>").replace(/^## (.+)$/gm, "<h2>$1</h2>").replace(/^# (.+)$/gm, "<h1>$1</h1>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/^[ \t]*[-*] (.+)$/gm, "<li>$1</li>").replace(/(?:<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/\n/g, "<br>").replace(/<br>(<\/?(ul|li|h\d|pre))/g, "$1").replace(/(<\/(ul|h\d|pre)>)<br>/g, "$1")
    .replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  return h;
}
