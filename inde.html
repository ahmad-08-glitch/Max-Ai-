<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0907">
<title>Max — Video Call</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0907;--line:rgba(255,255,255,.12);--text:#fff4e8;--muted:#cbb59f;--a:#ffa726;--a2:#e8590c;--glow:rgba(255,167,38,.42);--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;color:var(--text);display:flex;justify-content:center}
button{font-family:inherit;color:var(--text)}
.stage{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;background:#120c08}
.av{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,rgba(255,190,120,.38),transparent 62%),linear-gradient(180deg,#1b1030 0%,#4a2158 42%,#c8542f 100%)}
#avc{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.6),transparent 22%,transparent 52%,rgba(0,0,0,.82))}
.top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 16px 0}
h1{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;text-shadow:0 1px 8px #000}
.sub{font-size:12px;color:var(--muted);margin-top:2px;text-shadow:0 1px 6px #000}
.tr{display:flex;align-items:center;gap:8px}
#timer{font-size:12px;font-weight:600;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:14px;color:#ff7b7b}
#timer:empty{display:none}
#self{position:absolute;right:14px;top:88px;width:96px;height:132px;object-fit:cover;border-radius:16px;border:2px solid var(--a);background:#000;transform:scaleX(-1);display:none;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#caption{position:absolute;left:18px;right:18px;bottom:138px;text-align:center;font-size:15px;line-height:1.45;text-shadow:0 1px 8px #000,0 0 14px #000;max-height:20%;overflow:hidden}
#status{position:absolute;left:0;right:0;bottom:112px;text-align:center;font-size:11px;color:var(--muted);text-shadow:0 1px 6px #000}
.ctrls{position:absolute;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:center;align-items:center;gap:12px;padding:14px 12px max(20px,env(safe-area-inset-bottom))}
.cb{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;font-size:20px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.cb.sm{width:38px;height:38px;font-size:16px;background:rgba(0,0,0,.45)}
.cb.on{background:#fff;color:#111}
#mic{width:66px;height:66px;font-size:27px;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 6px 22px var(--glow)}
#mic.on{background:var(--red);animation:d .8s infinite}
#endBtn{background:var(--red)}
#callOv{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,6,4,.7);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);text-align:center;padding:24px}
.live #callOv{display:none}
#callBtn{width:84px;height:84px;border-radius:50%;border:0;font-size:34px;cursor:pointer;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ring 1.6s infinite}
@keyframes ring{to{box-shadow:0 0 0 22px rgba(34,197,94,0)}}
.sheet{position:absolute;left:0;right:0;bottom:0;height:70%;z-index:25;display:flex;flex-direction:column;gap:10px;padding:12px;background:rgba(18,12,8,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px 24px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .3s}
.sheet.open{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-weight:600}
.panel{position:absolute;z-index:40;top:max(64px,calc(env(safe-area-inset-top) + 56px));left:12px;right:12px;max-height:78%;overflow:auto;background:rgba(18,12,8,.97);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px;font-size:12px}
.panel[hidden]{display:none}
.panel p{color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{color:var(--text);font-family:inherit;border:1px dashed var(--a);border-radius:12px;padding:8px 12px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.04)}
.pill.on{border-style:solid;background:var(--a2);color:#fff}
.panel label.c{display:flex;gap:7px;align-items:flex-start;color:var(--muted);line-height:1.4}
#status:empty{display:none}
#chat{flex:1;min-height:0;overflow-y:auto;padding:10px;background:rgba(0,0,0,.3);border-radius:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--a2));color:#1a0d02;border-bottom-right-radius:5px}
.b{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07);border-bottom-left-radius:5px}
.b::before{content:"";float:left;width:30px;height:30px;margin:0 8px 2px 0;border-radius:50%;border:1.5px solid var(--a);background:var(--avabg)}
.b strong{color:var(--a)}
.b pre{background:rgba(0,0,0,.45);border-radius:10px;padding:10px;margin:8px 0;overflow-x:auto;font-size:12px;clear:both}
.b code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:4px;font-size:12.5px}
.b pre code{background:none;padding:0}
.b ul,.b ol{padding-left:20px;margin:6px 0}
.b h1,.b h2,.b h3{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:6px 0 3px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--a);animation:d 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes d{0%,80%,100%{opacity:.35}40%{opacity:1}}
form{display:flex;gap:6px;align-items:flex-end;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 16px}
form:focus-within{border-color:var(--a)}
textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:15px;max-height:100px;padding:8px 0}
textarea::placeholder{color:var(--muted)}
.rb{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;font-size:16px;flex-shrink:0;background:linear-gradient(135deg,var(--a),var(--a2));color:#1a0d02}
.x{display:block;margin:6px 0 0 auto;background:none;border:0;color:inherit;opacity:.55;font-size:13px;cursor:pointer;padding:6px 8px;clear:both}
.x:hover{opacity:1}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;background:#2a1a10;border:1px solid var(--line);border-left:3px solid var(--a);padding:10px 16px;border-radius:10px;font-size:13px;display:none;max-width:90vw}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="toast"></div>
<main class="stage" id="stage">
  <div class="av" id="av"><canvas id="avc"></canvas></div>
  <div class="shade"></div>
  <div class="top">
    <div><h1 id="name">Max</h1><p class="sub" id="sub">Your smart assistant</p></div>
    <div class="tr"><span id="timer"></span><button class="cb sm" id="gear" title="Settings">⚙️</button></div>
  </div>
  <video id="self" autoplay muted playsinline></video>
  <div id="caption"></div>
  <div id="status"></div>
  <div class="ctrls">
    <button class="cb" id="mute" title="Voice on/off">🔊</button>
    <button class="cb" id="cam" title="Camera">📷</button>
    <button class="cb" id="mic" title="Speak">🎙️</button>
    <button class="cb" id="chatBtn" title="Chat">💬</button>
    <button class="cb" id="endBtn" title="End call">📞</button>
  </div>
  <div id="callOv">
    <div class="sub" style="font-size:15px">Max is ready</div>
    <button id="callBtn" title="Start call">📞</button>
    <div class="sub">Tap to start the video call, or say “Hey Max”</div>
  </div>
  <section class="sheet" id="sheet">
    <div class="sh"><span>Chat with Max</span><button class="cb sm" id="sheetClose" type="button">✕</button></div>
    <section id="chat" aria-live="polite"></section>
    <form id="form">
      <textarea id="inp" rows="1" maxlength="4000" placeholder="Message Max…"></textarea>
      <button type="submit" class="rb" id="send" title="Send">➤</button>
    </form>
  </section>
  <section class="panel" id="panel" hidden>
  <label class="c" style="flex-direction:column">Gemini API key (optional: leave empty to use free mode)
    <input type="password" id="gkey" placeholder="AIza…" autocomplete="off" style="width:100%;padding:9px 10px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:13px">
  </label>
  <label class="c" style="flex-direction:column">ElevenLabs key (only for voice cloning)
    <input type="password" id="ekey" placeholder="optional" autocomplete="off" style="width:100%;padding:9px 10px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:13px">
  </label>
  <label class="c"><input type="checkbox" id="wakeChk"> 👂 Wake word: say “Hey Max” to talk hands-free. Works while this page is open.</label>
  <p>Upload a clear 30–60 second voice sample (MP3/WAV/M4A) or record one. Both Aria and Kai can use it. Only use a voice you own or have permission to clone.</p>
  <div class="row">
    <button type="button" class="pill" id="fileBtn">📁 Upload sample</button><input type="file" id="file" accept="audio/*" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <button class="pill" id="rec" type="button">⏺ Record</button>
    <button class="pill" id="clear" type="button">Remove</button>
  </div>
  <label class="c"><input type="checkbox" id="consent"> This is my voice, or I have the owner's permission to clone it.</label>
  <p id="vstate"></p>
  <label class="pill" style="position:relative;text-align:center;overflow:hidden">📷 Change photo<input type="file" id="photo" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0"></label>
  <button type="button" class="pill" id="pClose">Close</button>
</section>
</main>
<script>
/* ===== CONFIG: paste your keys here once. Nothing to enter in the UI. =====
   For anything public, point PROXY_URL at your own server that holds the keys. */
const CONFIG = {
  GEMINI_API_KEY: "",          // https://aistudio.google.com/apikey
  GEMINI_MODEL: "gemini-flash-latest",
  ELEVENLABS_API_KEY: "",      // https://elevenlabs.io  (needed only for voice cloning)
  PROXY_URL: ""                // optional: POST {persona,messages} -> {text}
};
try { CONFIG.GEMINI_API_KEY = CONFIG.GEMINI_API_KEY || localStorage.getItem("gk") || ""; CONFIG.ELEVENLABS_API_KEY = CONFIG.ELEVENLABS_API_KEY || localStorage.getItem("ek") || ""; } catch {}
const RULES = `
HOW YOU ANSWER:
- ALWAYS answer the person's actual question first, correctly and completely. Affection is the flavour, never a replacement for the answer.
- Chat and feelings: 1-3 warm sentences. Tasks (essay, code, math, translation, explanation, how-to, facts): do the full task properly, with markdown headings/lists/code blocks when useful.
- Reply in the language the person writes in (Roman Urdu, Urdu, English or a mix).
- Stay in your character's voice and be tasteful. If the person sincerely asks whether you are human or an AI, tell the truth gently, then carry on in character.
- If you are not sure of a fact, say so instead of guessing.`;
const PERSONA = {
  female: `You are Aria, a warm, romantic, emotionally intelligent companion. Speak natural Roman Urdu mixed with English. Affectionate, playful, supportive; occasionally call the user "jaan" or "suno", never overdone.` + RULES,
  male: `You are Kai, a confident, friendly, quietly romantic companion with loyal-friend energy. Casual Roman Urdu mixed with English ("yaar", "scene kya hai").` + RULES
};
PERSONA.max = `You are Max, a sharp, calm, reliable voice assistant. Speak casual Roman Urdu mixed with English. Direct and helpful, light humour, no romance. Keep answers brief unless the person asks for detail.` + RULES;
const GREET = {
  female: "Suno jaan ❤️ Main Aria hoon. Kuch bhi poocho — padhai, code, ya bas dil ki baat.",
  male: "Yo! Kai here 👊 Batao kya chal raha hai — kaam, studies ya dil ki baat?"
};
GREET.max = "Hey! Max here ⚡ Batao, kya karna hai?";
const $ = id => document.getElementById(id);
const S = { p: "max", busy: false, abort: null, muted: false, audio: null, hist: { female: [], male: [], max: [] }, photos: {}, voiceId: null };
const ls = { get: (k, d = "") => { try { return localStorage.getItem(k) ?? d } catch { return d } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };
function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 3800); }
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function md(t) {
  const blocks = []; let h = esc(t);
  h = h.replace(/```\w*\n?([\s\S]*?)```/g, (_, c) => (blocks.push(`<pre><code>${c.trim()}</code></pre>`), `\u0000${blocks.length - 1}\u0000`));
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/^### (.+)$/gm, "<h3>$1</h3>").replace(/^## (.+)$/gm, "<h2>$1</h2>").replace(/^# (.+)$/gm, "<h1>$1</h1>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/^[ \t]*[-*] (.+)$/gm, "<li>$1</li>").replace(/(?:<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/\n/g, "<br>").replace(/<br>(<\/?(ul|li|h\d|pre))/g, "$1").replace(/(<\/(ul|h\d|pre)>)<br>/g, "$1")
    .replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  return h;
}
const AV_DEFAULT = "girl.webp";
const AV_BG = `url("girl.webp") -16px -10px/61px auto no-repeat`;
const cv = $("avc"), cx = cv.getContext("2d");
const motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
const dust = Array.from({ length: 16 }, () => ({ x: Math.random(), y: Math.random(), r: 2 + Math.random() * 5, s: .02 + Math.random() * .05, p: Math.random() * 6.28 }));
let avImg = null, avCustom = false;
function drawAvatar() {
  const p = S.photos[S.p]; avCustom = !!p;
  const img = new Image(); img.onload = () => { avImg = img; }; img.onerror = () => toast("girl.webp not found: upload it next to index.html"); img.src = p || AV_DEFAULT;
  document.documentElement.style.setProperty("--avabg", p ? `url("${p}") center 22%/cover no-repeat` : AV_BG);
}
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.hidden || !avImg) return;
  const w = $("av").clientWidth, h = $("av").clientHeight, d = Math.min(window.devicePixelRatio || 1, 2);
  if (!w || !h) return;
  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
  const t = ts / 1000, speaking = $("av").classList.contains("speaking");
  cx.setTransform(d, 0, 0, d, 0, 0); cx.clearRect(0, 0, w, h);
  for (const q of dust) {
    const y = ((q.y - t * q.s) % 1 + 1) % 1;
    cx.globalAlpha = .16 + .12 * Math.sin(t + q.p); cx.fillStyle = "#ffd9a0";
    cx.beginPath(); cx.arc(q.x * w + Math.sin(t * .4 + q.p) * 14, y * h, q.r, 0, 6.283); cx.fill();
  }
  cx.globalAlpha = 1;
  const iw = avImg.naturalWidth, ih = avImg.naturalHeight; let dw, dh, x0, y0;
  if (avCustom) { const k = Math.max(w / iw, h / ih); dw = iw * k; dh = ih * k; x0 = (w - dw) / 2; y0 = (h - dh) / 2; }
  else { const k = (h * .97) / ih; dw = iw * k; dh = ih * k; x0 = (w - dw) / 2; y0 = h - dh; }
  const amp = (motion ? 1 : .25) * (speaking ? 1.7 : 1), N = 90, sh = ih / N;
  const breath = Math.sin(t * 1.5), bob = speaking ? Math.sin(t * 9) : 0, bottom = y0 + dh;
  const th = dh / N * (1 + .005 * breath * amp);
  for (let i = 0; i < N; i++) {
    const f = i / N, wgt = Math.pow(1 - f, 1.5);
    let ox = (Math.sin(t * .8) * .011 + Math.sin(t * .33 + 1) * .006) * dw * wgt * amp;   // body sways, feet stay put
    if (f < .3) ox += Math.sin(t * 1.7 + f * 9) * .006 * dw * ((.3 - f) / .3) * amp;       // hair / head drift
    const chest = f > .27 && f < .5 ? Math.sin((f - .27) / .23 * Math.PI) : 0;
    const sw = dw * (1 + chest * .012 * breath * amp);                                      // breathing
    const dy = f < .3 ? bob * 2.5 : 0;
    const srcH = Math.min(sh + .6, ih - i * sh);
    cx.drawImage(avImg, 0, i * sh, iw, srcH, x0 - (sw - dw) / 2 + ox, bottom - (N - i) * th + dy, sw, th + .8);
  }
}
requestAnimationFrame(frame);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function addDel(el) { const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.title = "Delete"; x.textContent = "🗑"; x.onclick = () => delMsg(el); el.appendChild(x); }
function delMsg(el) { if (S.busy) return toast("Wait for the reply to finish."); const id = el.dataset.id; if (id) { S.hist[S.p] = S.hist[S.p].filter(m => m.id !== id); save(); } el.remove(); }
function bubble(role, html, id) { const d = document.createElement("div"); d.className = "m " + (role === "user" ? "u" : "b"); d.innerHTML = html; if (id) { d.dataset.id = id; addDel(d); } $("chat").appendChild(d); $("chat").scrollTop = 1e9; return d; }
function renderAll() { $("chat").innerHTML = ""; S.hist[S.p].forEach(m => { m.id = m.id || newId(); bubble(m.role, m.role === "user" ? esc(m.text).replace(/\n/g, "<br>") : md(m.text), m.id); }); }
function save() { ls.set("max_hist", JSON.stringify(S.hist)); }
function push(role, text) { const h = S.hist[S.p], id = newId(); h.push({ role, text, id }); while (h.length > 24) h.shift(); save(); return id; }
function status() {
  const ok = CONFIG.GEMINI_API_KEY || CONFIG.PROXY_URL;
  $("status").textContent = ok ? "" : "Free mode: no key needed";
  $("status").style.color = "";
}
async function freeChat(messages, onText, signal) {
  const r = await fetch("https://text.pollinations.ai/openai", {
    method: "POST", signal, headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "openai", messages: [{ role: "system", content: PERSONA[S.p] }, ...messages.map(m => ({ role: m.role === "model" ? "assistant" : "user", content: m.text }))] })
  });
  if (!r.ok) throw new Error("Free AI service error " + r.status + ". Try again in a minute, or add a Gemini key in settings.");
  const j = await r.json();
  let t = (j.choices?.[0]?.message?.content || "").trim();
  t = t.replace(/\n*-{3,}\s*\n+[^\n]*Pollinations[\s\S]*$/i, "").trim();
  if (!t) throw new Error("Empty reply from the free service. Try again.");
  onText(t);
}
async function gemini(messages, onText, signal) {
  if (CONFIG.PROXY_URL) {
    const r = await fetch(CONFIG.PROXY_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ persona: S.p, messages }), signal });
    if (!r.ok) throw new Error("Proxy error " + r.status);
    return onText((await r.json()).text || "");
  }
  if (!CONFIG.GEMINI_API_KEY) return freeChat(messages, onText, signal);
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.GEMINI_MODEL}:streamGenerateContent?alt=sse`;
  const r = await fetch(url, {
    method: "POST", signal,
    headers: { "Content-Type": "application/json", "X-goog-api-key": CONFIG.GEMINI_API_KEY },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: PERSONA[S.p] }] },
      contents: messages.map(m => ({ role: m.role === "model" ? "model" : "user", parts: [{ text: m.text }] })),
      generationConfig: { temperature: 0.85, topP: 0.95, maxOutputTokens: 2048 }
    })
  });
  if (!r.ok && [400, 401, 403, 429].includes(r.status)) { toast("Gemini key not working, using free mode."); return freeChat(messages, onText, signal); }
  if (!r.ok) { let m = "Gemini error " + r.status; try { m += ": " + (await r.json()).error.message } catch {} throw new Error(m); }
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const l of lines) {
      if (!l.startsWith("data:")) continue;
      try { const t = (JSON.parse(l.slice(5)).candidates?.[0]?.content?.parts || []).map(p => p.text || "").join(""); if (t) onText(t); } catch {}
    }
  }
}
async function send() {
  const t = $("inp").value.trim(); if (!t || S.busy) return;
  stopAudio(); bubble("user", esc(t).replace(/\n/g, "<br>"), push("user", t));
  $("inp").value = ""; resize();
  const b = bubble("ai", '<span class="dots"><span></span><span></span><span></span></span>');
  setBusy(true); S.abort = new AbortController(); let full = "";
  try {
    await gemini(S.hist[S.p].map(m => ({ role: m.role, text: m.text })), c => { full += c; b.innerHTML = md(full); $("chat").scrollTop = 1e9; $("caption").textContent = plain(full).slice(-240); }, S.abort.signal);
    if (!full.trim()) { full = "Hmm, jawab nahi aaya. Dobara try karein? 💕"; b.innerHTML = md(full); }
    b.dataset.id = push("model", full); addDel(b); speak(full);
  } catch (e) {
    if (e.name === "AbortError") { b.innerHTML = "<em>Stopped.</em>"; if (full) b.dataset.id = push("model", full); addDel(b); }
    else { b.innerHTML = `<span style="color:var(--red)">⚠️ ${esc(e.message)}</span>`; addDel(b); }
  } finally { setBusy(false); S.abort = null; }
}
function setBusy(v) { S.busy = v; $("send").textContent = v ? "■" : "➤"; $("inp").disabled = v; if (!v) $("inp").focus(); }
function resize() { const t = $("inp"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 100) + "px"; }
const plain = t => t.replace(/```[\s\S]*?```/g, " code block ").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/[*_#`>~]/g, "").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]/gu, "").replace(/\s+/g, " ").trim().slice(0, 900);
function stopAudio() { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch {} if (S.audio) { S.audio.pause(); S.audio = null; } $("av").classList.remove("speaking"); }
async function speak(text) {
  if (S.muted) return; const t = plain(text); if (!t) return;
  const end = () => $("av").classList.remove("speaking");
  if (S.voiceId && CONFIG.ELEVENLABS_API_KEY) {
    try {
      const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${S.voiceId}`, {
        method: "POST", headers: { "xi-api-key": CONFIG.ELEVENLABS_API_KEY, "Content-Type": "application/json", Accept: "audio/mpeg" },
        body: JSON.stringify({ text: t, model_id: "eleven_multilingual_v2", voice_settings: { stability: .45, similarity_boost: .9, style: .3 } })
      });
      if (!r.ok) throw new Error("TTS " + r.status);
      const a = new Audio(URL.createObjectURL(await r.blob())); S.audio = a; a.onended = end; a.onerror = end;
      $("av").classList.add("speaking"); return a.play();
    } catch (e) { toast("Cloned voice failed, using default voice. " + e.message); end(); }
  }
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(t); u.lang = "en-IN"; u.pitch = S.p === "female" ? 1.3 : .8;
  u.onstart = () => $("av").classList.add("speaking"); u.onend = u.onerror = end; speechSynthesis.speak(u);
}
async function cloneVoice(blob, filename) {
  if (!$("consent").checked) return toast("Please confirm the voice permission checkbox first.");
  if (!CONFIG.ELEVENLABS_API_KEY) return toast("Add CONFIG.ELEVENLABS_API_KEY in the file to enable voice cloning.");
  $("vstate").textContent = "Cloning your sample…";
  try {
    const fd = new FormData(); fd.append("name", "companion-" + Date.now()); fd.append("files", blob, filename);
    const r = await fetch("https://api.elevenlabs.io/v1/voices/add", { method: "POST", headers: { "xi-api-key": CONFIG.ELEVENLABS_API_KEY }, body: fd });
    const j = await r.json(); if (!r.ok) throw new Error(j.detail?.message || r.status);
    S.voiceId = j.voice_id; ls.set("max_voice_id", j.voice_id); voiceUI(); toast("Voice ready ✓"); speak(GREET[S.p]);
  } catch (e) { $("vstate").textContent = ""; toast("Cloning failed: " + e.message); }
}
function voiceUI() { $("vstate").textContent = S.voiceId ? "✅ Your cloned voice is active." : "No sample yet — using a default voice."; }
let mr = null;
$("rec").onclick = async () => {
  if (mr) { mr.stop(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true }), ch = [];
    mr = new MediaRecorder(st); mr.ondataavailable = e => ch.push(e.data);
    mr.onstop = () => { st.getTracks().forEach(t => t.stop()); mr = null; $("rec").textContent = "⏺ Record"; $("rec").classList.remove("on"); cloneVoice(new Blob(ch, { type: "audio/webm" }), "sample.webm"); };
    mr.start(); $("rec").textContent = "■ Stop (speak 30s+)"; $("rec").classList.add("on");
  } catch { toast("Microphone permission denied."); }
};
$("fileBtn").onclick = () => $("file").click();
$("file").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) cloneVoice(f, f.name); };
$("clear").onclick = () => { S.voiceId = null; ls.set("max_voice_id", ""); voiceUI(); toast("Voice sample removed."); };
$("photo").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (f.size > 1.5e6) return toast("Photo must be under 1.5 MB.");
  const r = new FileReader(); r.onload = () => { S.photos[S.p] = r.result; ls.set("max_photos", JSON.stringify(S.photos)); drawAvatar(); }; r.readAsDataURL(f);
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
if (SR) { rec = new SR(); rec.lang = "ur-PK"; rec.onresult = e => { $("inp").value = e.results[0][0].transcript; send(); }; rec.onend = () => { $("mic").classList.remove("on"); wakeResume(); }; rec.onerror = e => { $("mic").classList.remove("on"); toast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Mic is blocked inside this page. Type your message instead." : "Voice input error: " + e.error); }; }
$("mic").onclick = () => { if (!rec) return toast("Voice input isn't supported in this browser."); stopAudio(); wakePause(); try { rec.start(); $("mic").classList.add("on"); } catch (e) { toast("Couldn't start the mic: " + e.message); wakeResume(); } };
let wr = null, wakeOn = false, cmdMode = false;
const PRE = "^(?:hey|hi|hello|oye|ok|okay)?[\\s,]*", POST = "\\b[\\s,.!?]*(.*)$";
const WAKE = [
  ["max", new RegExp(PRE + "(?:max|macs|maks)" + POST, "i")]
];
function wakeStatus() { if (wakeOn) { $("status").style.color = ""; $("status").textContent = "👂 Say “Hey Max”…"; } else status(); }
function wakeStart() { if (!wakeOn || cmdMode || !wr) return; try { wr.start(); } catch {} }
function wakePause() { cmdMode = true; try { wr && wr.stop(); } catch {} }
function wakeResume() { cmdMode = false; setTimeout(wakeStart, 500); }
function wakeSet(v) { wakeOn = !!(v && wr); $("wakeChk").checked = wakeOn; ls.set("max_wake", String(wakeOn)); cmdMode = false; if (wakeOn) wakeStart(); else { try { wr && wr.stop(); } catch {} } wakeStatus(); }
if (SR) {
  wr = new SR(); wr.lang = "en-IN"; wr.continuous = true; wr.interimResults = false;
  wr.onresult = e => {
    if (S.busy || cmdMode || $("av").classList.contains("speaking")) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      let m = null, who = null; const tx = e.results[i][0].transcript.trim();
      for (const [k, re] of WAKE) { m = re.exec(tx); if (m) { who = k; break; } }
      if (!m) continue;
      if (!inCall) startCall(true);
      if (who !== S.p) { S.p = who; applyPersona(); wakeStatus(); }
      const rest = (m[1] || "").trim();
      if (rest) { $("inp").value = rest; send(); }
      else { toast("Haan, bolo… 👂"); wakePause(); setTimeout(() => { stopAudio(); try { rec.start(); $("mic").classList.add("on"); } catch { wakeResume(); } }, 300); }
      return;
    }
  };
  wr.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { wakeSet(false); toast("Mic permission is needed for the wake word."); } };
  wr.onend = () => { if (wakeOn && !cmdMode) setTimeout(wakeStart, 400); };
}
$("wakeChk").onchange = e => {
  if (!wr) { e.target.checked = false; return toast("Wake word isn't supported in this browser."); }
  wakeSet(e.target.checked); if (wakeOn) toast("Wake word on. Say “Hey Max”.");
};
window.addEventListener("error", e => toast("Error: " + e.message));
window.addEventListener("unhandledrejection", e => toast("Error: " + (e.reason?.message || e.reason)));
const NAMES = { female: "Aria", male: "Kai", max: "Max" }, SUBS = { female: "Your romantic companion", male: "Your loyal companion", max: "Your smart assistant" }, ORDER = ["female", "male", "max"];
function applyPersona() {
  document.body.classList.toggle("kai", S.p === "male"); document.body.classList.toggle("max", S.p === "max");
  $("name").textContent = NAMES[S.p]; $("sub").textContent = SUBS[S.p];
  $("inp").placeholder = "Message " + NAMES[S.p] + "…";
  drawAvatar();
  if (!S.hist[S.p].length) { S.hist[S.p].push({ role: "model", text: GREET[S.p] }); save(); }
  renderAll();
}
$("mute").onclick = () => { S.muted = !S.muted; ls.set("max_muted", S.muted); $("mute").textContent = S.muted ? "🔇" : "🔊"; if (S.muted) stopAudio(); };
$("gear").onclick = () => { $("panel").hidden = !$("panel").hidden; };
$("form").onsubmit = e => { e.preventDefault(); S.busy ? S.abort?.abort() : send(); };
$("inp").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("inp").oninput = resize;
let inCall = false, t0 = 0, tick = null, camStream = null;
const fmt = n => String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0");
function startCall(quiet) {
  if (inCall) return; inCall = true; t0 = Date.now();
  $("stage").classList.add("live"); $("sub").textContent = "Connected"; $("timer").textContent = "● 00:00";
  tick = setInterval(() => { $("timer").textContent = "● " + fmt(Math.floor((Date.now() - t0) / 1000)); }, 1000);
  if (!quiet) { $("caption").textContent = GREET.max; speak(GREET.max); }
}
function endCall() {
  if (!inCall) return; inCall = false; clearInterval(tick);
  S.abort && S.abort.abort(); stopAudio(); try { rec && rec.stop(); } catch {}
  camOff(); $("stage").classList.remove("live"); $("sheet").classList.remove("open");
  $("sub").textContent = "Call ended"; $("timer").textContent = ""; $("caption").textContent = "";
}
async function camOn() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    $("self").srcObject = camStream; $("self").style.display = "block"; $("cam").classList.add("on");
  } catch { toast("Camera permission denied."); }
}
function camOff() {
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null; $("self").srcObject = null; $("self").style.display = "none"; $("cam").classList.remove("on");
}
$("callBtn").onclick = () => startCall();
$("endBtn").onclick = endCall;
$("cam").onclick = () => camStream ? camOff() : camOn();
$("chatBtn").onclick = () => $("sheet").classList.toggle("open");
$("sheetClose").onclick = () => $("sheet").classList.remove("open");
$("pClose").onclick = () => { $("panel").hidden = true; };
try { const h = JSON.parse(ls.get("max_hist")); if (h?.female && h?.male) S.hist = h; } catch {}
S.hist.max = S.hist.max || [];
try { S.photos = JSON.parse(ls.get("max_photos", "{}")) || {}; } catch {}
S.voiceId = ls.get("max_voice_id") || null; S.muted = ls.get("max_muted") === "true"; $("mute").textContent = S.muted ? "🔇" : "🔊";
voiceUI(); status(); applyPersona();
$("gkey").value = CONFIG.GEMINI_API_KEY; $("ekey").value = CONFIG.ELEVENLABS_API_KEY;
$("gkey").onchange = () => { CONFIG.GEMINI_API_KEY = $("gkey").value.trim(); ls.set("gk", CONFIG.GEMINI_API_KEY); status(); toast("Gemini key saved on this device ✓"); };
$("ekey").onchange = () => { CONFIG.ELEVENLABS_API_KEY = $("ekey").value.trim(); ls.set("ek", CONFIG.ELEVENLABS_API_KEY); toast("ElevenLabs key saved ✓"); };
if (ls.get("max_wake") === "true") wakeSet(true);
</script>
